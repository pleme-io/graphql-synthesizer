[package]
name = "graphql-synthesizer"
version = "0.1.1"
edition = "2024"
rust-version = "1.89.0"
description = "Typed AST for structurally correct GraphQL executable-document generation"
license = "MIT"
repository = "https://github.com/pleme-io/graphql-synthesizer"

[dependencies]
# crates.io, not git: a crates.io release cannot carry a git dependency,
# and the family publishes there (go-synthesizer 0.1.2 is the proof).
synthesizer-core = "0.1.1"

[dev-dependencies]
proptest = "1"
